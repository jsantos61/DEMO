<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Information</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <style>
      /* Center the card component in the middle of the screen */
      .card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      /* ///////////////////////////// */
      #genesys-messenger{
        opacity: 0;
        pointer-events: none;
      }

      /* ///////////////////////////// */
      #contactDiv{
        opacity: 0;
        pointer-events: none;
      }

      /* ///////////////////////////// */
      #chat{
        font-size: 1.60714rem;
        width: 26px;
        height: 26px;
      }

      /* ///////////////////////////// */
      #first{
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 56px;
        height: 56px;
        z-index: 10000;
        border-radius: 50% !important;
        border: none;
        background-color: #1F7A76;
        transition: background-color 250ms ease, box-shadow 250ms ease, border-color 250ms ease;
        box-shadow: 
        rgba(0, 0, 0, 0.2) 0px 3px 5px -2px,
        rgba(0, 0, 0, 0.14) 0px 1px 4px 2px,
        rgba(0, 0, 0, 0.12) 0px 1px 4px 1px;
      }

      /* ///////////////////////////// */
      #first:hover{
        background-color: rgb(37, 90, 86);
        box-shadow: 
        rgba(0, 0, 0, 0.2) 0px 3px 5px -2px,
        rgba(0, 0, 0, 0.14) 0px 1px 4px 2px,
        rgba(0, 0, 0, 0.12) 0px 1px 4px 1px;
      }

       /*  ///////////////////// */ 
      #demoText {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 4rem;
        font-weight: bold;
        color: #1F7A76; /* teal to match your button */
        text-align: center;
}
      /* Make the card component responsive */
      @media only screen and (max-width: 992px) {
        .card {
          width: 70%;
        }
      }

      @media only screen and (max-width: 576px) {
        .card {
          width: 90%;
        }
      }
    </style>
    <script type="text/javascript" charset="utf-8">
      (function (g, e, n, es, ys) {
        g["_genesysJs"] = e;
        g[e] =
          g[e] ||
          function () {
            (g[e].q = g[e].q || []).push(arguments);
          };
        g[e].t = 1 * new Date();
        g[e].c = es;
        ys = document.createElement("script");
        ys.async = 1;
        ys.src = n;
        ys.charset = "utf-8";
        document.head.appendChild(ys);
      })(
        window,
        "Genesys",
        "https://apps.use2.us-gov-pure.cloud/genesys-bootstrap/genesys.min.js",
        {
          environment: "fedramp-use2",
          deploymentId: "99fbdb84-fdde-4d2f-a70b-8f9ed021e5fa",
        }
      );
    </script>
  </head>

  <body>
    <h1 id="demoText">DEMO SITE ONLY</h1>
    <div class="container">
        
        <!----------------------------->
        <button id="first">
            <svg viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="white"
              style="transform: translateY(1px); transform-origin: 0 0;">
             <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2M6 9h12v2H6zm8 5H6v-2h8zm4-6H6V6h12z"></path>
          </svg>
        </button>
        
      <!-------------Added an ID contactDiv---------------->
      <div class="card" id="contactDiv" style="background-color: #369992; color: white">
        <div class="card-body">
          <h5 class="card-title">Provide Your Information</h5>
          <!-------------Added an ID contactForm---------------->
          <form id="contactForm" class="needs-validation" novalidate>
            <div class="form-group">
              <label for="fullName">Full Name:</label>
              <input
                type="text"
                class="form-control"
                id="fullName"
                name="fullName"
                required
                aria-label="*Full Name"
              />
              <div class="invalid-feedback">Please enter your full name.</div>
            </div>
            <div class="form-group">
              <label for="phoneNumber">Phone Number:</label>
              <input
                type="tel"
                class="form-control"
                id="phoneNumber"
                name="phoneNumber"
                aria-label="*Phone Number"
              />
              <div class="invalid-feedback"> Please enter your phone number.</div>
            </div>
            <div class="form-group">
              <label for="email">Email Address:</label>
              <input
                type="text"
                class="form-control"
                id="email"
                name="email"
                aria-label="*Email Address"
              />
              <div class="invalid-feedback">Please enter your email address.</div>
			  </div>
			  <div class="form-group">
              <label for="license">License Number:</label>
              <input
                type="text"
                class="form-control"
                id="license"
                name="license"
                aria-label="License Number"
              />
              <div class="invalid-feedback">Please enter your license number if applicable.</div>
            </div>			
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      ///////////////////////////////////////
      document.getElementById("first").addEventListener("click", function(event){
        document.getElementById("contactDiv").style.opacity = "100";
        document.getElementById("contactDiv").style.pointerEvents = "all";
      });
      ///////////////////////////////////////

      var form = document.querySelector("#contactForm");
      function toggleMessenger() {
        Genesys(
          "command",
          "Messenger.open",
          {},
          function (o) {}, // if resolved
          function (o) {
            // if rejected
            Genesys("command", "Messenger.close");
          }
        );
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (!form.checkValidity()) {
          // Invalid form data
        } else {
          
          ///////////////////////////////////////
          document.getElementById("first").removeEventListener("click", function(event){
            document.getElementById("contactDiv").style.opacity = "100";
            document.getElementById("contactDiv").style.pointerEvents = "all";
          });
          document.getElementById("first").style.opacity = "0";
          document.getElementById("first").style.pointerEvents = "none";
          document.getElementById("first").style.zIndex = "50";
          document.getElementById("genesys-messenger").style.opacity = "100";
          document.getElementById("genesys-messenger").style.pointerEvents = "all";
          document.getElementById("contactDiv").style.opacity = "0";
          document.getElementById("contactDiv").style.pointerEvents = "none";
          ///////////////////////////////////////

          var formData = new FormData(event.target); // Get Form Element in FormData
          var formProps = Object.fromEntries(formData); // Get JSON object from FormData where key is "name" attribute of input element  in form.

          // Setting retrived JSON object into custom attributes of Genesys. It should trigger "Database.updated" according to documentation.
          Genesys("command", "Database.set", {
            messaging: {
              customAttributes: {
                customerFullName: formProps["fullName"],
                customerPhoneNumber: formProps["phoneNumber"],
				customerEmail: formProps["email"],
				customerLicense: formProps["license"],
              },
            },
          });
        }

        form.classList.add("was-validated");
      });
		
      // This should be triggered whenever there is "Database.set" command executed.
      Genesys("subscribe", "Database.updated", function (e) {
        console.log(e.data); // Updated database object
        toggleMessenger(); // Open messenger chat window

        //ADD CODE HERE TO CLOSE THIS FORM
      });
    </script>
  </body>
</html>
